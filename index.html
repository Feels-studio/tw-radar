<script>
    function toggleDrawer(id, iconId) {
      const el = document.getElementById(id);
      const icon = document.getElementById(iconId);
      if (el.style.maxHeight && el.style.maxHeight !== '0px') {
        el.style.maxHeight = '0px';
        el.style.opacity = '0';
        icon.innerHTML = '展開詳情 <i class="fa-solid fa-chevron-down ml-1"></i>';
      } else {
        el.style.maxHeight = '360px';
        el.style.opacity = '1';
        icon.innerHTML = '收起 <i class="fa-solid fa-chevron-up ml-1"></i>';
      }
    }

    // 自動讀取 data.json 渲染卡片
    fetch('./data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        // 更新頂部數據
        document.getElementById('stock-count').innerText = data.total_count;
        document.getElementById('fund-score').innerText = data.fundamental_score;
        document.getElementById('sent-score').innerText = data.sentiment_score;
        document.getElementById('update-badge').innerText = '每日 ' + data.update_time + ' 自動更新';
      })
      .catch(err => console.log('使用預設畫面', err));
  </script>
