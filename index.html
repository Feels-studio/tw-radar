<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>台股探測</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="台股探測">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .smooth-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .kline-crosshair {
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-[#121214] text-zinc-900 antialiased select-none">

  <!-- 頂部黑底主看板 -->
  <div class="bg-[#121214] text-white pt-4 pb-7 px-6 rounded-b-[2.5rem] shadow-2xl">
    
    <!-- 頂端列：行情更新時間與搜尋按鈕 -->
    <div class="flex justify-between items-center mb-5">
      <div>
        <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-mono">MARKET DATA</div>
        <div id="market-date" class="text-xs text-zinc-400 font-medium">資料載入中...</div>
      </div>
      <button onclick="refreshData()" id="scan-btn" class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 active:scale-95 text-zinc-950 font-bold rounded-full shadow-lg shadow-amber-500/20 smooth-transition">
        <i id="scan-icon" class="fa-solid fa-arrows-rotate text-xs"></i>
        <span class="text-xs tracking-wider">更新行情</span>
      </button>
    </div>
    
    <!-- 個股主視覺卡片 -->
    <div class="my-2">
      <div class="flex items-baseline gap-2 mb-1">
        <span id="focus-name" class="text-2xl font-bold tracking-tight text-white">--</span>
        <span id="focus-code" class="text-xs font-mono text-zinc-400">----</span>
        <span id="focus-status" class="ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">--</span>
      </div>

      <div class="flex items-baseline gap-3 my-1">
        <div class="text-5xl font-black tracking-tight" id="focus-price">--</div>
        <div class="text-sm font-bold font-mono" id="focus-change">--</div>
      </div>
      <p id="focus-desc" class="text-xs text-zinc-400 mt-1 line-clamp-1">請在下方選擇標的進行檢視</p>
    </div>

    <!-- 雙軌看板 -->
    <div class="grid grid-cols-2 gap-3 mt-5">
      <div class="bg-zinc-800/60 rounded-2xl p-3 border border-zinc-700/40">
        <div id="stat-1-label" class="text-[10px] text-zinc-400 mb-0.5">供需異動分</div>
        <div class="flex items-baseline gap-1.5">
          <span id="stat-1-val" class="text-xl font-black text-amber-300">--</span>
          <span id="stat-1-sub" class="text-[10px] text-zinc-500">/ 100</span>
        </div>
      </div>
      <div class="bg-zinc-800/60 rounded-2xl p-3 border border-zinc-700/40">
        <div id="stat-2-label" class="text-[10px] text-zinc-400 mb-0.5">市場情緒溫差</div>
        <div class="flex items-baseline gap-1.5">
          <span id="stat-2-val" class="text-xl font-black text-emerald-400">--</span>
          <span id="stat-2-sub" class="text-[10px] text-zinc-500">/ 100</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 下半部淺灰內容區 -->
  <div class="bg-[#F2F2F7] min-h-screen px-5 pt-6 pb-36 rounded-t-[2rem] -mt-4 shadow-inner">

    <!-- 視圖 1: 標的清單 -->
    <div id="view-radar">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-bold text-zinc-400 tracking-wider">最新真實行情（點擊切換上方看板）</span>
        <span id="list-count" class="text-xs font-mono font-medium text-amber-800">0 檔</span>
      </div>
      <div id="cards-container" class="space-y-4"></div>
    </div>

    <!-- 視圖 2: 主流財經前沿情報 -->
    <div id="view-foreign" class="hidden space-y-3">
      <div class="text-xs font-bold text-zinc-400 tracking-wider px-1 mb-2">主流財經媒體產業前沿與出處</div>
      <div id="foreign-container" class="space-y-3"></div>
    </div>

    <!-- 視圖 3: 自選清單 -->
    <div id="view-watchlist" class="hidden">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-bold text-zinc-400 tracking-wider">自選深度追蹤（籌碼、合約負債與均量）</span>
        <button onclick="clearWatchlist()" class="text-[11px] text-zinc-400 hover:text-red-500">清空</button>
      </div>
      <div id="watchlist-container" class="space-y-4"></div>
    </div>

    <!-- 視圖 4: 自訂計劃 -->
    <div id="view-rules" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-zinc-200/60 space-y-4">
        <div>
          <h3 class="font-bold text-sm text-zinc-900">自訂個人化篩選計劃</h3>
          <p class="text-[11px] text-zinc-500 mt-0.5">系統將根據您設定的紀律條件自動篩選真實標的</p>
        </div>

        <div class="p-3 bg-zinc-50 rounded-xl border border-zinc-100 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-zinc-800">1. 成交量突變條件</span>
            <span class="text-amber-700 font-mono font-bold" id="lbl-vol-rule">突破 20日均量 1.5 倍</span>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <label class="text-[10px] text-zinc-500">追蹤均量</label>
              <select id="rule-ma-days" class="w-full mt-1 p-1.5 bg-white border border-zinc-200 rounded-lg text-xs" onchange="updateRulePreview()">
                <option value="20" selected>20 日均量</option>
              </select>
            </div>
            <div>
              <label class="text-[10px] text-zinc-500">放量門檻</label>
              <select id="rule-vol-mult" class="w-full mt-1 p-1.5 bg-white border border-zinc-200 rounded-lg text-xs" onchange="updateRulePreview()">
                <option value="1.2">超過 1.2 倍</option>
                <option value="1.5" selected>超過 1.5 倍</option>
                <option value="2.0">超過 2.0 倍</option>
              </select>
            </div>
          </div>
        </div>

        <button onclick="applyRulesAndScan()" class="w-full py-3 bg-amber-500 active:bg-amber-600 text-zinc-950 font-bold text-xs rounded-xl shadow smooth-transition">
          套用計劃並依此條件篩選
        </button>
      </div>
    </div>

  </div>

  <!-- 底部懸浮導航膠囊 -->
  <div class="fixed bottom-7 left-1/2 -translate-x-1/2 z-50">
    <div class="bg-[#1A1A1E]/95 backdrop-blur-md px-6 py-2.5 rounded-full border border-zinc-700/70 shadow-2xl flex items-center justify-around gap-7 text-zinc-400">
      <button id="nav-radar" onclick="switchTab('radar')" class="text-amber-400 flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-list-ul text-sm mb-0.5"></i>
        <span class="text-[10px]">標的</span>
      </button>
      <button id="nav-foreign" onclick="switchTab('foreign')" class="hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-globe text-sm mb-0.5"></i>
        <span class="text-[10px]">前沿</span>
      </button>
      <button id="nav-watchlist" onclick="switchTab('watchlist')" class="hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-star text-sm mb-0.5"></i>
        <span class="text-[10px]">自選</span>
      </button>
      <button id="nav-rules" onclick="switchTab('rules')" class="hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-sliders text-sm mb-0.5"></i>
        <span class="text-[10px]">計劃</span>
      </button>
    </div>
  </div>

  <script>
    let rawStocksData = [];
    let currentList = [];
    let focusedStock = null;
    let isViewingWatchlist = false;

    let userStrategy = {
      maDays: 20,
      volMultiplier: 1.5
    };

    function updateRulePreview() {
      userStrategy.volMultiplier = parseFloat(document.getElementById('rule-vol-mult').value);
      document.getElementById('lbl-vol-rule').innerText = `突破 20日均量 ${userStrategy.volMultiplier.toFixed(1)} 倍`;
    }

    function applyRulesAndScan() {
      updateRulePreview();
      switchTab('radar');
      currentList = rawStocksData.filter(s => (s.details.volMultiple || 1) >= userStrategy.volMultiplier);
      if (currentList.length === 0) currentList = rawStocksData;
      setFocusStock(currentList[0], false);
      renderList(currentList);
    }

    // 本地持久化自選清單
    function getWatchlistData() {
      try {
        return JSON.parse(localStorage.getItem('tw_radar_watch_v6') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveWatchlistData(data) {
      localStorage.setItem('tw_radar_watch_v6', JSON.stringify(data));
    }

    function toggleWatchlist(code) {
      let data = getWatchlistData();
      if (data[code]) {
        delete data[code];
      } else {
        const target = rawStocksData.find(s => s.code === code);
        data[code] = {
          addDate: new Date().toISOString().split('T')[0],
          basePrice: target ? target.price : 0,
          customCost: null
        };
      }
      saveWatchlistData(data);
      renderList(currentList);
      renderWatchlist();
      if (focusedStock && focusedStock.code === code) {
        setFocusStock(focusedStock, isViewingWatchlist);
      }
    }

    function updateCustomCost(code, val) {
      let data = getWatchlistData();
      if (data[code]) {
        const parsed = parseFloat(val);
        data[code].customCost = isNaN(parsed) || parsed <= 0 ? null : parsed;
        saveWatchlistData(data);
        renderWatchlist();
        if (focusedStock && focusedStock.code === code) {
          setFocusStock(focusedStock, true);
        }
      }
    }

    function clearWatchlist() {
      if (confirm('確定清空自選追蹤清單？')) {
        saveWatchlistData({});
        renderList(currentList);
        renderWatchlist();
      }
    }

    // 核心連動：點擊下方標的，更新頂部大看板
    function setFocusStock(stock, fromWatchlist = false) {
      if (!stock) return;
      focusedStock = stock;
      isViewingWatchlist = fromWatchlist;

      document.getElementById('focus-name').innerText = stock.name;
      document.getElementById('focus-code').innerText = stock.code;
      document.getElementById('focus-desc').innerText = stock.desc;
      
      const priceEl = document.getElementById('focus-price');
      const changeEl = document.getElementById('focus-change');
      const statusEl = document.getElementById('focus-status');
      
      priceEl.innerText = '$' + stock.price.toFixed(2);
      changeEl.innerText = stock.change;
      statusEl.innerText = stock.status;

      if (stock.isUp) {
        priceEl.className = "text-5xl font-black tracking-tight text-red-500";
        changeEl.className = "text-sm font-bold font-mono text-red-500";
        statusEl.className = "ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-red-500/10 text-red-400 border border-red-500/30";
      } else {
        priceEl.className = "text-5xl font-black tracking-tight text-emerald-500";
        changeEl.className = "text-sm font-bold font-mono text-emerald-500";
        statusEl.className = "ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
      }

      const lbl1 = document.getElementById('stat-1-label');
      const val1 = document.getElementById('stat-1-val');
      const sub1 = document.getElementById('stat-1-sub');

      const lbl2 = document.getElementById('stat-2-label');
      const val2 = document.getElementById('stat-2-val');
      const sub2 = document.getElementById('stat-2-sub');

      const watchData = getWatchlistData();
      const watchInfo = watchData[stock.code];

      if (fromWatchlist && watchInfo) {
        lbl1.innerText = "累積漲跌幅";
        const cost = watchInfo.customCost !== null ? watchInfo.customCost : watchInfo.basePrice;
        const gainPercent = (((stock.price - cost) / cost) * 100).toFixed(2);
        const isGain = stock.price >= cost;
        val1.innerText = (isGain ? '+' : '') + gainPercent + '%';
        val1.className = isGain ? "text-xl font-black text-red-400 font-mono" : "text-xl font-black text-emerald-400 font-mono";
        sub1.innerText = watchInfo.customCost !== null ? "自訂成本計" : "基準收盤計";

        lbl2.innerText = "持有成本";
        val2.innerText = '$' + cost.toFixed(2);
        val2.className = "text-xl font-black text-amber-300 font-mono";
        sub2.innerText = "TWD";
      } else {
        lbl1.innerText = "供需異動分";
        val1.innerText = stock.fundScore || 85;
        val1.className = "text-xl font-black text-amber-300 font-mono";
        sub1.innerText = "/ 100";

        lbl2.innerText = "市場情緒溫差";
        val2.innerText = stock.sentScore || 25;
        val2.className = "text-xl font-black text-emerald-400 font-mono";
        sub2.innerText = "/ 100";
      }

      renderList(currentList);
      if (fromWatchlist) renderWatchlist();
    }

    // 真實 K 線圖繪製（十字游標 Tooltip）
    function renderInteractiveKline(containerId, klineData) {
      if (!klineData || klineData.length === 0) return '<div class="text-xs text-zinc-400 p-3">暫無真實 K 線數據</div>';
      
      const w = 330;
      const hKline = 130;
      const hVol = 40;
      const totalH = hKline + hVol + 15;
      const count = klineData.length;
      const barW = Math.max((w / count) * 0.65, 3);
      const gap = w / count;

      const minPrice = Math.min(...klineData.map(d => d.low)) * 0.99;
      const maxPrice = Math.max(...klineData.map(d => d.high)) * 1.01;
      const maxVol = Math.max(...klineData.map(d => d.vol)) * 1.1 || 1;

      const priceToY = (p) => hKline - ((p - minPrice) / (maxPrice - minPrice)) * (hKline - 15) - 8;
      const volToH = (v) => (v / maxVol) * hVol;

      let candlesSvg = '';
      let volumesSvg = '';

      klineData.forEach((d, i) => {
        const x = i * gap + gap / 2;
        const color = d.isUp ? '#ef4444' : '#10b981';
        
        candlesSvg += `<line x1="${x}" y1="${priceToY(d.high)}" x2="${x}" y2="${priceToY(d.low)}" stroke="${color}" stroke-width="1.2" />`;
        
        const yOpen = priceToY(d.open);
        const yClose = priceToY(d.close);
        const topY = Math.min(yOpen, yClose);
        const bodyH = Math.max(Math.abs(yClose - yOpen), 2);
        candlesSvg += `<rect x="${x - barW / 2}" y="${topY}" width="${barW}" height="${bodyH}" fill="${color}" rx="0.5" />`;

        const vH = volToH(d.vol);
        const yV = totalH - vH;
        volumesSvg += `<rect x="${x - barW / 2}" y="${yV}" width="${barW}" height="${vH}" fill="${color}" opacity="0.6" rx="0.5" />`;
      });

      return `
        <div class="relative w-full" id="wrapper_${containerId}">
          <div id="tip_${containerId}" class="flex flex-wrap justify-between items-center text-[10px] font-mono bg-zinc-100 px-2 py-1 rounded-lg text-zinc-600 mb-2">
            <span>日期: <b id="t_date_${containerId}" class="text-zinc-800">${klineData[count-1].date}</b></span>
            <span>開: <b id="t_open_${containerId}" class="text-zinc-800">${klineData[count-1].open}</b></span>
            <span>高: <b id="t_high_${containerId}" class="text-zinc-800">${klineData[count-1].high}</b></span>
            <span>低: <b id="t_low_${containerId}" class="text-zinc-800">${klineData[count-1].low}</b></span>
            <span>收: <b id="t_close_${containerId}" class="${klineData[count-1].isUp ? 'text-red-500' : 'text-emerald-500'} font-bold">${klineData[count-1].close}</b></span>
            <span>量: <b id="t_vol_${containerId}" class="text-zinc-800">${klineData[count-1].vol}張</b></span>
          </div>

          <svg id="svg_${containerId}" viewBox="0 0 ${w} ${totalH}" class="w-full h-44 cursor-crosshair overflow-visible touch-none">
            <line x1="0" y1="${hKline / 2}" x2="${w}" y2="${hKline / 2}" stroke="#e4e4e7" stroke-dasharray="3 3" />
            <line x1="0" y1="${hKline + 5}" x2="${w}" y2="${hKline + 5}" stroke="#d4d4d8" />
            ${candlesSvg}
            ${volumesSvg}
            <line id="cursor_v_${containerId}" x1="-100" y1="0" x2="-100" y2="${totalH}" stroke="#71717a" stroke-dasharray="2 2" stroke-width="1" class="kline-crosshair hidden" />
          </svg>
        </div>
      `;
    }

    function initKlineCrosshair(containerId, klineData) {
      const svg = document.getElementById(`svg_${containerId}`);
      if (!svg || !klineData) return;

      const vLine = document.getElementById(`cursor_v_${containerId}`);
      const w = 330;
      const count = klineData.length;
      const gap = w / count;

      function update(clientX) {
        const rect = svg.getBoundingClientRect();
        const offsetX = Math.max(0, Math.min(clientX - rect.left, rect.width));
        const svgX = (offsetX / rect.width) * w;
        const idx = Math.min(Math.max(Math.floor(svgX / gap), 0), count - 1);
        const d = klineData[idx];

        const barX = idx * gap + gap / 2;
        vLine.setAttribute('x1', barX);
        vLine.setAttribute('x2', barX);
        vLine.classList.remove('hidden');

        document.getElementById(`t_date_${containerId}`).innerText = d.date;
        document.getElementById(`t_open_${containerId}`).innerText = d.open;
        document.getElementById(`t_high_${containerId}`).innerText = d.high;
        document.getElementById(`t_low_${containerId}`).innerText = d.low;
        
        const closeEl = document.getElementById(`t_close_${containerId}`);
        closeEl.innerText = d.close;
        closeEl.className = d.isUp ? 'text-red-500 font-bold' : 'text-emerald-500 font-bold';

        document.getElementById(`t_vol_${containerId}`).innerText = d.vol + '張';
      }

      svg.addEventListener('mousemove', (e) => update(e.clientX));
      svg.addEventListener('mouseleave', () => vLine.classList.add('hidden'));
      svg.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) update(e.touches[0].clientX);
      }, { passive: true });
      svg.addEventListener('touchend', () => vLine.classList.add('hidden'));
    }

    function toggleDrawer(id, iconId, klineInitCallback) {
      const el = document.getElementById(id);
      const icon = document.getElementById(iconId);
      if (!el) return;
      if (el.style.maxHeight && el.style.maxHeight !== '0px') {
        el.style.maxHeight = '0px';
        el.style.opacity = '0';
        if (icon) icon.innerHTML = '展開近月日K <i class="fa-solid fa-chevron-down ml-1"></i>';
      } else {
        el.style.maxHeight = '900px';
        el.style.opacity = '1';
        if (icon) icon.innerHTML = '收起 <i class="fa-solid fa-chevron-up ml-1"></i>';
        if (klineInitCallback) setTimeout(klineInitCallback, 50);
      }
    }

    function renderList(stocks) {
      const container = document.getElementById('cards-container');
      const watchData = getWatchlistData();
      container.innerHTML = '';

      document.getElementById('list-count').innerText = stocks.length + ' 檔';

      stocks.forEach(stock => {
        const isWatched = !!watchData[stock.code];
        const isSelected = focusedStock && focusedStock.code === stock.code && !isViewingWatchlist;
        const starClass = isWatched ? 'fa-solid fa-star text-amber-500' : 'fa-regular fa-star text-zinc-300 hover:text-amber-500';
        const priceColor = stock.isUp ? 'text-red-500' : 'text-emerald-500';
        const selectedBorder = isSelected ? 'border-amber-500 shadow-md ring-1 ring-amber-500/30' : 'border-zinc-200/70';

        const tagsHtml = (stock.tags || []).map(t => `<span class="px-2 py-0.5 rounded text-[10px] bg-zinc-100 text-zinc-700 font-medium">${t}</span>`).join('');
        const chartContainerId = `kline_${stock.code}`;

        const card = `
          <div onclick="setFocusStock(rawStocksData.find(s=>s.code==='${stock.code}'), false)" class="bg-white rounded-2xl p-4 border ${selectedBorder} smooth-transition active:scale-[0.99] cursor-pointer">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-lg font-bold text-zinc-900">${stock.name}</span>
                  <span class="text-xs font-mono text-zinc-500 bg-zinc-100 px-1.5 py-0.5 rounded">${stock.code}</span>
                  <button onclick="event.stopPropagation(); toggleWatchlist('${stock.code}')" class="p-1">
                    <i class="${starClass} text-xs"></i>
                  </button>
                </div>
                <p class="text-xs text-zinc-500 mt-1">${stock.desc}</p>
              </div>

              <div class="text-right">
                <div class="text-base font-black ${priceColor}">$${stock.price.toFixed(2)}</div>
                <div class="text-xs font-bold font-mono ${priceColor}">${stock.change}</div>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 mt-3">
              ${tagsHtml}
            </div>

            <div onclick="event.stopPropagation(); toggleDrawer('drawer_${stock.code}', 'icon_${stock.code}', () => initKlineCrosshair('${chartContainerId}', rawStocksData.find(s=>s.code==='${stock.code}').kline))" class="flex items-center justify-between mt-3 pt-3 border-t border-zinc-100 text-[11px] text-zinc-400">
              <span class="text-zinc-500"><i class="fa-solid fa-chart-column mr-1"></i>真實日K線（滑動查看）</span>
              <span id="icon_${stock.code}">展開近月日K <i class="fa-solid fa-chevron-down ml-1"></i></span>
            </div>

            <div id="drawer_${stock.code}" class="drawer-content max-h-0 opacity-0 overflow-hidden text-xs text-zinc-700 space-y-2.5 pt-0">
              <div class="mt-2.5 bg-zinc-50 rounded-xl p-3 border border-zinc-100">
                ${renderInteractiveKline(chartContainerId, stock.kline)}
              </div>
              <div class="bg-zinc-50 rounded-xl p-3 border border-zinc-100 space-y-1.5 text-[11px]">
                <div><b>量能特徵：</b>${stock.reasonVolume}</div>
                <div><b>籌碼動向：</b>${stock.reasonChips}</div>
                <div><b>媒體關注：</b>${stock.reasonMedia}</div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });
    }

    function renderForeign(stocks) {
      const container = document.getElementById('foreign-container');
      container.innerHTML = '';
      stocks.forEach(s => {
        const intel = s.foreignIntel;
        if (!intel || !intel.title) return;
        container.insertAdjacentHTML('beforeend', `
          <div class="bg-white rounded-2xl p-4 border border-zinc-200/60 space-y-2">
            <div class="flex justify-between items-center text-[10px] text-zinc-400">
              <span class="font-bold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full font-mono">${intel.source}</span>
              <span class="font-mono">${intel.date}</span>
            </div>
            <div class="text-xs font-bold text-zinc-900 leading-snug">${intel.title}</div>
            <p class="text-xs text-zinc-600 leading-relaxed">${intel.summary}</p>
            <div class="pt-2 border-t border-zinc-100 flex justify-between items-center text-[11px]">
              <span class="text-zinc-400">關聯標的：<b>${s.name} (${s.code})</b></span>
              <a href="${intel.url}" target="_blank" class="text-amber-700 font-medium hover:underline flex items-center gap-1">
                出處索引 <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
              </a>
            </div>
          </div>
        `);
      });
    }

    function renderWatchlist() {
      const container = document.getElementById('watchlist-container');
      const watchData = getWatchlistData();
      const codes = Object.keys(watchData);
      container.innerHTML = '';

      if (codes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-20 text-zinc-400 text-xs">
            <i class="fa-regular fa-star text-3xl mb-3 text-zinc-300"></i>
            <p>尚無自選追蹤標的</p>
          </div>
        `;
        return;
      }

      codes.forEach(code => {
        const stock = rawStocksData.find(s => s.code === code);
        if (!stock) return;
        const info = watchData[code];
        const d = stock.details || {};

        const isSelected = focusedStock && focusedStock.code === stock.code && isViewingWatchlist;
        const selectedBorder = isSelected ? 'border-amber-500 shadow-md ring-1 ring-amber-500/30' : 'border-zinc-200/70';

        const card = `
          <div onclick="setFocusStock(rawStocksData.find(s=>s.code==='${stock.code}'), true)" class="bg-white rounded-2xl p-4 border ${selectedBorder} cursor-pointer smooth-transition active:scale-[0.99] space-y-3">
            
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-lg font-bold text-zinc-900">${stock.name}</span>
                  <span class="text-xs font-mono text-zinc-500 bg-zinc-100 px-1.5 py-0.5 rounded">${stock.code}</span>
                  <button onclick="event.stopPropagation(); toggleWatchlist('${stock.code}')" class="text-amber-500 text-xs">
                    <i class="fa-solid fa-star"></i>
                  </button>
                </div>
                <div class="text-[10px] text-zinc-400 mt-0.5">基準日：${info.addDate} · 基準收盤 $${info.basePrice.toFixed(2)}</div>
              </div>

              <div class="text-right" onclick="event.stopPropagation()">
                <div class="text-[10px] text-zinc-400 mb-0.5">買入成本(TWD)</div>
                <div class="flex items-center justify-end gap-1">
                  <span class="text-zinc-400 text-xs font-mono">$</span>
                  <input 
                    type="number" 
                    step="0.05" 
                    placeholder="${info.basePrice.toFixed(2)}" 
                    value="${info.customCost !== null ? info.customCost : ''}" 
                    onchange="updateCustomCost('${stock.code}', this.value)"
                    class="w-16 px-1.5 py-0.5 text-right text-xs bg-zinc-50 border border-zinc-200 rounded focus:outline-none focus:border-amber-500 text-zinc-800 font-bold font-mono"
                  />
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-100 text-[11px]">
              <div class="bg-zinc-50 p-2 rounded-lg border border-zinc-100">
                <span class="text-zinc-400 text-[10px] block">合約負債季增</span>
                <span class="font-bold text-zinc-800 font-mono">${d.contractQuarterGain || '--'}</span>
              </div>
              <div class="bg-zinc-50 p-2 rounded-lg border border-zinc-100">
                <span class="text-zinc-400 text-[10px] block">大戶吸籌動態</span>
                <span class="font-bold text-amber-700 font-mono">連增 ${d.chipsWeekStreak || '--'} 週</span>
              </div>
              <div class="bg-zinc-50 p-2 rounded-lg border border-zinc-100">
                <span class="text-zinc-400 text-[10px] block">均量與今日量比</span>
                <span class="font-bold text-zinc-800 font-mono">${d.volMultiple || 1} 倍 20MA</span>
                <span class="text-[9px] text-zinc-500 font-mono">(${d.todayVol || 0}張)</span>
              </div>
              <div class="bg-zinc-50 p-2 rounded-lg border border-zinc-100">
                <span class="text-zinc-400 text-[10px] block">散戶融資水位</span>
                <span class="font-bold text-zinc-700 font-mono text-[10px]">${d.marginDebt || '低檔'}</span>
              </div>
            </div>

          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });
    }

    function switchTab(tab) {
      const views = ['radar', 'foreign', 'watchlist', 'rules'];
      views.forEach(v => {
        const el = document.getElementById('view-' + v);
        const nav = document.getElementById('nav-' + v);
        if (v === tab) {
          el.classList.remove('hidden');
          nav.className = 'text-amber-400 flex flex-col items-center justify-center min-w-[34px] smooth-transition';
        } else {
          el.classList.add('hidden');
          nav.className = 'text-zinc-400 hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition';
        }
      });
      if (tab === 'watchlist') {
        renderWatchlist();
        const watchCodes = Object.keys(getWatchlistData());
        if (watchCodes.length > 0 && (!focusedStock || !isViewingWatchlist)) {
          setFocusStock(rawStocksData.find(s => s.code === watchCodes[0]), true);
        }
      }
    }

    // 真正從 data.json 讀取最新行情
    function refreshData() {
      const icon = document.getElementById('scan-icon');
      icon.classList.add('fa-spin');

      fetch('./data.json?t=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error('無法載入 data.json');
          return res.json();
        })
        .then(data => {
          rawStocksData = data.stocks || [];
          currentList = rawStocksData;

          document.getElementById('market-date').innerText = '最新更新: ' + (data.update_time || '--');
          
          if (currentList.length > 0) {
            setFocusStock(currentList[0], false);
            renderList(currentList);
            renderForeign(currentList);
          }
          icon.classList.remove('fa-spin');
        })
        .catch(err => {
          console.error(err);
          icon.classList.remove('fa-spin');
        });
    }

    // 初始化直接讀取
    refreshData();
  </script>
</body>
</html>
