<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>台股探測</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="台股探測">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .smooth-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drawer-content {
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
    }
    .kline-crosshair {
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-[#121214] text-zinc-900 antialiased select-none">

  <!-- 頂部主看板 -->
  <div class="bg-[#121214] text-white pt-5 pb-6 px-6 rounded-b-[2.5rem] shadow-2xl">
    
    <div class="flex justify-between items-center mb-6">
      <div>
        <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-mono">MARKET DATA</div>
        <div id="market-date" class="text-xs text-zinc-400 font-mono mt-0.5">載入中...</div>
      </div>
      <button onclick="executeScan()" id="scan-btn" class="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 active:scale-95 text-zinc-950 font-bold rounded-full shadow-lg shadow-amber-500/20 smooth-transition">
        <span id="scan-text" class="text-xs tracking-wider">篩選標的</span>
      </button>
    </div>
    
    <!-- 個股焦點 -->
    <div class="my-2">
      <div class="flex items-baseline gap-2.5 mb-1">
        <span id="focus-name" class="text-2xl font-bold tracking-tight text-white">--</span>
        <span id="focus-code" class="text-xs font-mono text-zinc-400">----</span>
        <span id="focus-status" class="ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-zinc-800 text-amber-400 border border-amber-500/30">--</span>
      </div>

      <div class="flex items-baseline gap-3 my-1">
        <div class="text-5xl font-black tracking-tight font-mono" id="focus-price">--</div>
        <div class="text-sm font-bold font-mono" id="focus-change">--</div>
      </div>
      <p id="focus-desc" class="text-xs text-zinc-400 mt-1 line-clamp-1">請在下方點選標的</p>
    </div>

    <!-- 雙軌分數 -->
    <div class="grid grid-cols-2 gap-3 mt-5">
      <div onclick="toggleTopScoreDetail('left')" class="bg-zinc-800/70 active:bg-zinc-700/80 rounded-2xl p-3.5 border border-zinc-700/50 cursor-pointer smooth-transition">
        <div class="flex justify-between items-center mb-1">
          <span id="stat-1-label" class="text-[11px] text-zinc-400">供需分數</span>
          <span class="text-[10px] text-zinc-500">明細</span>
        </div>
        <div class="flex items-baseline gap-1.5">
          <span id="stat-1-val" class="text-xl font-black text-amber-300 font-mono">--</span>
          <span id="stat-1-sub" class="text-[10px] text-zinc-500 font-mono">/ 100</span>
        </div>
      </div>

      <div onclick="toggleTopScoreDetail('right')" class="bg-zinc-800/70 active:bg-zinc-700/80 rounded-2xl p-3.5 border border-zinc-700/50 cursor-pointer smooth-transition">
        <div class="flex justify-between items-center mb-1">
          <span id="stat-2-label" class="text-[11px] text-zinc-400">情緒溫差</span>
          <span class="text-[10px] text-zinc-500">明細</span>
        </div>
        <div class="flex items-baseline gap-1.5">
          <span id="stat-2-val" class="text-xl font-black text-emerald-400 font-mono">--</span>
          <span id="stat-2-sub" class="text-[10px] text-zinc-500 font-mono">/ 100</span>
        </div>
      </div>
    </div>

    <!-- 數據明細抽屜 -->
    <div id="top-score-drawer" class="hidden mt-3 p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-xs text-zinc-300 space-y-2">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
        <span id="drawer-title" class="font-bold text-amber-300">--</span>
        <span onclick="closeTopScoreDrawer()" class="text-zinc-500 hover:text-white cursor-pointer text-[11px]">關閉</span>
      </div>
      <div id="drawer-body" class="space-y-1.5 leading-relaxed font-mono text-[11px] pt-1"></div>
    </div>
  </div>

  <!-- 下半部內容區 -->
  <div class="bg-[#F2F2F7] min-h-screen px-5 pt-6 pb-36 rounded-t-[2rem] -mt-4 shadow-inner">

    <!-- 視圖 1: 標的 -->
    <div id="view-radar">
      <div class="flex justify-between items-center mb-3 px-1">
        <span id="active-rule-summary" class="text-xs font-bold text-zinc-500">全台股真實篩選</span>
        <span id="list-count" class="text-xs font-mono font-bold text-zinc-700">0 檔</span>
      </div>
      <div id="cards-container" class="space-y-3.5"></div>
    </div>

    <!-- 視圖 2: 前沿 -->
    <div id="view-foreign" class="hidden space-y-3">
      <div class="text-xs font-bold text-zinc-500 px-1 mb-2">主流財經報導索引</div>
      <div id="foreign-container" class="space-y-3"></div>
    </div>

    <!-- 視圖 3: 自選 -->
    <div id="view-watchlist" class="hidden">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-bold text-zinc-500">自選追蹤清單</span>
        <button onclick="clearWatchlist()" class="text-xs text-zinc-400 hover:text-red-600">清空</button>
      </div>
      <div id="watchlist-container" class="space-y-3.5"></div>
    </div>

    <!-- 視圖 4: 計劃 -->
    <div id="view-rules" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-zinc-200/60 space-y-4">
        <div class="flex justify-between items-start border-b border-zinc-100 pb-3">
          <div>
            <h3 class="font-bold text-base text-zinc-900">個人化篩選計劃</h3>
            <p class="text-xs text-zinc-400 mt-0.5">點擊說明可檢視判斷依據</p>
          </div>
          <button onclick="resetDefaultStrategy()" class="text-xs text-zinc-500 bg-zinc-100 px-3 py-1 rounded-lg font-medium">重置</button>
        </div>

        <!-- 條件 1：RVOL -->
        <div class="p-4 bg-zinc-50 rounded-xl border border-zinc-100 space-y-2.5">
          <div class="flex justify-between items-start">
            <div>
              <div class="text-sm font-bold text-zinc-900">相對成交量 (RVOL)</div>
              <div class="text-xs font-bold text-red-600 font-mono mt-0.5" id="lbl-rvol">60日均量 1.5 倍以上</div>
            </div>
            <button onclick="toggleRuleExplain('exp-rvol')" class="text-xs text-zinc-400 hover:text-zinc-700 px-2 py-0.5 bg-white rounded border border-zinc-200">說明</button>
          </div>
          <div id="exp-rvol" class="hidden text-xs text-zinc-600 bg-white p-3 rounded-lg border border-zinc-200/70 leading-relaxed">
            當日成交量突破過去平均量的倍數，大於 1.5 倍代表機構資金大舉進場。
          </div>
          <div class="grid grid-cols-2 gap-2.5 text-xs pt-1">
            <div>
              <label class="text-[11px] text-zinc-500">基準均量</label>
              <select id="rule-ma-days" class="w-full mt-1 p-2 bg-white border border-zinc-200 rounded-lg text-xs font-medium" onchange="updateRulePreview()">
                <option value="20">20 日均量</option>
                <option value="60" selected>60 日均量</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] text-zinc-500">放量倍數</label>
              <select id="rule-vol-mult" class="w-full mt-1 p-2 bg-white border border-zinc-200 rounded-lg text-xs font-medium" onchange="updateRulePreview()">
                <option value="0.0">不限倍數 (全市場顯示)</option>
                <option value="1.0">1.0 倍以上</option>
                <option value="1.5" selected>1.5 倍以上</option>
                <option value="2.0">2.0 倍以上</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 條件 2：漲幅限制 -->
        <div class="p-4 bg-zinc-50 rounded-xl border border-zinc-100 space-y-2.5">
          <div class="flex justify-between items-start">
            <div>
              <div class="text-sm font-bold text-zinc-900">當日收盤方向</div>
              <div class="text-xs font-bold text-red-600 font-mono mt-0.5" id="lbl-rs">限上漲與平盤</div>
            </div>
            <button onclick="toggleRuleExplain('exp-trend')" class="text-xs text-zinc-400 hover:text-zinc-700 px-2 py-0.5 bg-white rounded border border-zinc-200">說明</button>
          </div>
          <div id="exp-trend" class="hidden text-xs text-zinc-600 bg-white p-3 rounded-lg border border-zinc-200/70 leading-relaxed">
            過濾掉帶量下跌的出貨標的，只保留多方表態之個股。
          </div>
          <div class="pt-1">
            <select id="rule-trend" class="w-full p-2 bg-white border border-zinc-200 rounded-lg text-xs font-medium" onchange="updateRulePreview()">
              <option value="any">全市場不限 (包含下跌)</option>
              <option value="up_only" selected>僅篩選紅盤上漲股 (漲幅 > 0%)</option>
            </select>
          </div>
        </div>

        <button onclick="applyRulesAndScan()" class="w-full py-3.5 bg-zinc-900 active:bg-zinc-800 text-amber-400 font-bold text-xs rounded-xl shadow smooth-transition">
          儲存設定並全市場篩選
        </button>
      </div>
    </div>

  </div>

  <!-- 底部精簡導航膠囊（寬度徹底縮窄，僅留剛好空間） -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
    <div class="pointer-events-auto bg-[#1A1A1E]/95 backdrop-blur-md py-2 px-4 rounded-full border border-zinc-700/70 shadow-2xl flex items-center gap-4 text-zinc-400">
      <button id="nav-radar" onclick="switchTab('radar')" class="text-amber-400 font-bold text-xs tracking-wider whitespace-nowrap smooth-transition px-1">標的</button>
      <button id="nav-foreign" onclick="switchTab('foreign')" class="hover:text-white font-medium text-xs tracking-wider whitespace-nowrap smooth-transition px-1">前沿</button>
      <button id="nav-watchlist" onclick="switchTab('watchlist')" class="hover:text-white font-medium text-xs tracking-wider whitespace-nowrap smooth-transition px-1">自選</button>
      <button id="nav-rules" onclick="switchTab('rules')" class="hover:text-white font-medium text-xs tracking-wider whitespace-nowrap smooth-transition px-1">計劃</button>
    </div>
  </div>

  <script>
    let rawStocksData = [];
    let currentList = [];
    let focusedStock = null;
    let isViewingWatchlist = false;
    let currentOpenScoreSide = null;

    const DEFAULT_STRATEGY = {
      maDays: 60,
      volMultiplier: 1.5,
      trendFilter: 'up_only'
    };

    let userStrategy = { ...DEFAULT_STRATEGY };

    function toggleRuleExplain(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    function loadStrategy() {
      try {
        const saved = JSON.parse(localStorage.getItem('tw_radar_all_strat_v3'));
        if (saved) userStrategy = { ...DEFAULT_STRATEGY, ...saved };
      } catch (e) {}
      syncStrategyUI();
    }

    function syncStrategyUI() {
      document.getElementById('rule-ma-days').value = userStrategy.maDays;
      document.getElementById('rule-vol-mult').value = userStrategy.volMultiplier.toFixed(1);
      document.getElementById('rule-trend').value = userStrategy.trendFilter;
      updateRulePreview();
    }

    function resetDefaultStrategy() {
      userStrategy = { ...DEFAULT_STRATEGY };
      localStorage.setItem('tw_radar_all_strat_v3', JSON.stringify(userStrategy));
      syncStrategyUI();
    }

    function updateRulePreview() {
      userStrategy.maDays = parseInt(document.getElementById('rule-ma-days').value);
      userStrategy.volMultiplier = parseFloat(document.getElementById('rule-vol-mult').value);
      userStrategy.trendFilter = document.getElementById('rule-trend').value;

      document.getElementById('lbl-rvol').innerText = userStrategy.volMultiplier === 0 
        ? `${userStrategy.maDays}日均量 · 不限倍數` 
        : `${userStrategy.maDays}日均量 ${userStrategy.volMultiplier.toFixed(1)} 倍以上`;
      document.getElementById('lbl-rs').innerText = userStrategy.trendFilter === 'up_only' ? '僅紅盤上漲股' : '全市場不限';
    }

    function applyRulesAndScan() {
      updateRulePreview();
      localStorage.setItem('tw_radar_all_strat_v3', JSON.stringify(userStrategy));
      switchTab('radar');
      executeScan();
    }

    function toggleTopScoreDetail(side) {
      const drawer = document.getElementById('top-score-drawer');
      if (!drawer.classList.contains('hidden') && currentOpenScoreSide === side) {
        closeTopScoreDrawer();
        return;
      }
      currentOpenScoreSide = side;
      drawer.classList.remove('hidden');
      renderTopScoreDrawerContent();
    }

    function closeTopScoreDrawer() {
      document.getElementById('top-score-drawer').classList.add('hidden');
      currentOpenScoreSide = null;
    }

    function renderTopScoreDrawerContent() {
      if (!focusedStock || !currentOpenScoreSide) return;
      const titleEl = document.getElementById('drawer-title');
      const bodyEl = document.getElementById('drawer-body');
      const ws = focusedStock.wallStreet || {};
      const watchData = getWatchlistData();
      const watchInfo = watchData[focusedStock.code];

      if (isViewingWatchlist && watchInfo) {
        const cost = watchInfo.customCost !== null ? watchInfo.customCost : watchInfo.basePrice;
        const diff = (focusedStock.price - cost).toFixed(2);
        const gainPct = (((focusedStock.price - cost) / cost) * 100).toFixed(2);
        const stopLossPrice = (cost * 0.935).toFixed(2);

        if (currentOpenScoreSide === 'left') {
          titleEl.innerText = `${focusedStock.name} (${focusedStock.code}) 損益明細`;
          bodyEl.innerHTML = `
            <div class="flex justify-between"><span>最新收盤：</span><b class="text-white">$${focusedStock.price.toFixed(2)}</b></div>
            <div class="flex justify-between"><span>計算成本：</span><b class="text-amber-300">$${cost.toFixed(2)}</b></div>
            <div class="flex justify-between"><span>每股價差：</span><b class="${diff >= 0 ? 'text-red-400' : 'text-emerald-400'}">${diff >= 0 ? '+' : ''}$${diff} (${gainPct}%)</b></div>
            <div class="flex justify-between"><span>每張損益：</span><b class="${diff >= 0 ? 'text-red-400' : 'text-emerald-400'}">${diff >= 0 ? '+' : ''}${Math.round(diff * 1000).toLocaleString()} TWD</b></div>
          `;
        } else {
          titleEl.innerText = `${focusedStock.name} (${focusedStock.code}) 風控防線`;
          bodyEl.innerHTML = `
            <div class="flex justify-between"><span>加入日期：</span><b class="text-white">${watchInfo.addDate}</b></div>
            <div class="flex justify-between"><span>-6.5% 停損點：</span><b class="text-emerald-400">$${stopLossPrice}</b></div>
            <div class="flex justify-between"><span>20MA 支撐：</span><b class="text-amber-300">$${ws.ma20Price || '--'}</b></div>
            <div class="flex justify-between"><span>60MA 季線：</span><b class="text-zinc-300">$${ws.ma60Price || '--'}</b></div>
          `;
        }
        return;
      }

      if (currentOpenScoreSide === 'left') {
        titleEl.innerText = `${focusedStock.name} 供需分數 (${focusedStock.fundScore}分)`;
        bodyEl.innerHTML = `
          <div class="flex justify-between"><span>相對量能 (RVOL)：</span><b class="text-amber-300">${ws.rvol60 || 1.5} 倍 (今日 ${ws.todayVol || 0}張 / 季均 ${ws.ma60Vol || 0}張)</b></div>
          <div class="flex justify-between"><span>RS 相對強度：</span><b class="text-white">${ws.rsRating || 80} / 99</b></div>
          <div class="flex justify-between"><span>千張大戶動向：</span><b class="text-amber-300">連增 ${ws.chipsStreak || 3} 週 (${ws.chipsPrev || '48%'} 至 ${ws.chipsCurr || '52%'})</b></div>
          <div class="flex justify-between"><span>合約負債規模：</span><b class="text-white">${ws.contractCurr || '4.2億'} (季增 +${ws.contractQoQ || 25}%)</b></div>
        `;
      } else {
        titleEl.innerText = `${focusedStock.name} 情緒溫差 (${focusedStock.sentScore}分)`;
        bodyEl.innerHTML = `
          <div class="flex justify-between"><span>融資使用率：</span><b class="text-emerald-400">${ws.marginUtil || 14}% (餘額 ${ws.marginLots || 2000} 張)</b></div>
          <div class="flex justify-between"><span>近 20 日融資變化：</span><b class="text-white">${ws.marginChg20d || -180} 張</b></div>
          <div class="flex justify-between"><span>總股東人數變化：</span><b class="text-emerald-400">${ws.holdersChg || '-3.8%'}</b></div>
        `;
      }
    }

    function getWatchlistData() {
      try {
        return JSON.parse(localStorage.getItem('tw_radar_watch_v7') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveWatchlistData(data) {
      localStorage.setItem('tw_radar_watch_v7', JSON.stringify(data));
    }

    function toggleWatchlist(code) {
      let data = getWatchlistData();
      if (data[code]) {
        delete data[code];
      } else {
        const target = rawStocksData.find(s => s.code === code);
        data[code] = {
          addDate: new Date().toISOString().split('T')[0],
          basePrice: target ? target.price : 0,
          customCost: null
        };
      }
      saveWatchlistData(data);
      renderList(currentList);
      renderWatchlist();
      if (focusedStock && focusedStock.code === code) {
        setFocusStock(focusedStock, isViewingWatchlist);
      }
    }

    function updateCustomCost(code, val) {
      let data = getWatchlistData();
      if (data[code]) {
        const parsed = parseFloat(val);
        data[code].customCost = isNaN(parsed) || parsed <= 0 ? null : parsed;
        saveWatchlistData(data);
        renderWatchlist();
        if (focusedStock && focusedStock.code === code) {
          setFocusStock(focusedStock, true);
        }
      }
    }

    function clearWatchlist() {
      if (confirm('確定清空自選清單？')) {
        saveWatchlistData({});
        renderList(currentList);
        renderWatchlist();
      }
    }

    function setFocusStock(stock, fromWatchlist = false) {
      if (!stock) return;
      focusedStock = stock;
      isViewingWatchlist = fromWatchlist;

      document.getElementById('focus-name').innerText = stock.name;
      document.getElementById('focus-code').innerText = stock.code;
      document.getElementById('focus-desc').innerText = stock.desc;
      
      const priceEl = document.getElementById('focus-price');
      const changeEl = document.getElementById('focus-change');
      const statusEl = document.getElementById('focus-status');
      
      priceEl.innerText = '$' + stock.price.toFixed(2);
      changeEl.innerText = stock.change;
      statusEl.innerText = stock.status;

      if (stock.isUp) {
        priceEl.className = "text-5xl font-black tracking-tight font-mono text-red-500";
        changeEl.className = "text-sm font-bold font-mono text-red-500";
        statusEl.className = "ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-red-500/10 text-red-400 border border-red-500/30";
      } else {
        priceEl.className = "text-5xl font-black tracking-tight font-mono text-emerald-500";
        changeEl.className = "text-sm font-bold font-mono text-emerald-500";
        statusEl.className = "ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
      }

      const lbl1 = document.getElementById('stat-1-label');
      const val1 = document.getElementById('stat-1-val');
      const sub1 = document.getElementById('stat-1-sub');

      const lbl2 = document.getElementById('stat-2-label');
      const val2 = document.getElementById('stat-2-val');
      const sub2 = document.getElementById('stat-2-sub');

      const watchData = getWatchlistData();
      const watchInfo = watchData[stock.code];

      if (fromWatchlist && watchInfo) {
        lbl1.innerText = "累積漲跌幅";
        const cost = watchInfo.customCost !== null ? watchInfo.customCost : watchInfo.basePrice;
        const gainPercent = (((stock.price - cost) / cost) * 100).toFixed(2);
        const isGain = stock.price >= cost;
        val1.innerText = (isGain ? '+' : '') + gainPercent + '%';
        val1.className = isGain ? "text-xl font-black text-red-400 font-mono" : "text-xl font-black text-emerald-400 font-mono";
        sub1.innerText = watchInfo.customCost !== null ? "自訂成本" : "基準收盤";

        lbl2.innerText = "持有成本";
        val2.innerText = '$' + cost.toFixed(2);
        val2.className = "text-xl font-black text-amber-300 font-mono";
        sub2.innerText = "TWD";
      } else {
        lbl1.innerText = "供需分數";
        val1.innerText = stock.fundScore || 85;
        val1.className = "text-xl font-black text-amber-300 font-mono";
        sub1.innerText = "/ 100";

        lbl2.innerText = "情緒溫差";
        val2.innerText = stock.sentScore || 25;
        val2.className = "text-xl font-black text-emerald-400 font-mono";
        sub2.innerText = "/ 100";
      }

      if (currentOpenScoreSide) renderTopScoreDrawerContent();
      renderList(currentList);
      if (fromWatchlist) renderWatchlist();
    }

    function renderInteractiveKline(containerId, klineData) {
      if (!klineData || klineData.length === 0) return '<div class="text-xs text-zinc-400 p-3">暫無 K 線資料</div>';
      
      const w = 330;
      const hKline = 130;
      const hVol = 40;
      const totalH = hKline + hVol + 15;
      const count = klineData.length;
      const barW = Math.max((w / count) * 0.65, 3);
      const gap = w / count;

      const minPrice = Math.min(...klineData.map(d => d.low)) * 0.99;
      const maxPrice = Math.max(...klineData.map(d => d.high)) * 1.01;
      const maxVol = Math.max(...klineData.map(d => d.vol)) * 1.1 || 1;

      const priceToY = (p) => hKline - ((p - minPrice) / (maxPrice - minPrice)) * (hKline - 15) - 8;
      const volToH = (v) => (v / maxVol) * hVol;

      let candlesSvg = '';
      let volumesSvg = '';

      klineData.forEach((d, i) => {
        const x = i * gap + gap / 2;
        const color = d.isUp ? '#ef4444' : '#10b981';
        
        candlesSvg += `<line x1="${x}" y1="${priceToY(d.high)}" x2="${x}" y2="${priceToY(d.low)}" stroke="${color}" stroke-width="1.2" />`;
        
        const yOpen = priceToY(d.open);
        const yClose = priceToY(d.close);
        const topY = Math.min(yOpen, yClose);
        const bodyH = Math.max(Math.abs(yClose - yOpen), 2);
        candlesSvg += `<rect x="${x - barW / 2}" y="${topY}" width="${barW}" height="${bodyH}" fill="${color}" rx="0.5" />`;

        const vH = volToH(d.vol);
        const yV = totalH - vH;
        volumesSvg += `<rect x="${x - barW / 2}" y="${yV}" width="${barW}" height="${vH}" fill="${color}" opacity="0.6" rx="0.5" />`;
      });

      return `
        <div class="relative w-full" id="wrapper_${containerId}">
          <div id="tip_${containerId}" class="flex flex-wrap justify-between items-center text-[10px] font-mono bg-zinc-100 px-2.5 py-1.5 rounded-lg text-zinc-600 mb-2">
            <span>日期 <b id="t_date_${containerId}" class="text-zinc-900">${klineData[count-1].date}</b></span>
            <span>開 <b id="t_open_${containerId}" class="text-zinc-900">${klineData[count-1].open}</b></span>
            <span>高 <b id="t_high_${containerId}" class="text-zinc-900">${klineData[count-1].high}</b></span>
            <span>低 <b id="t_low_${containerId}" class="text-zinc-900">${klineData[count-1].low}</b></span>
            <span>收 <b id="t_close_${containerId}" class="${klineData[count-1].isUp ? 'text-red-500' : 'text-emerald-500'} font-bold">${klineData[count-1].close}</b></span>
            <span>量 <b id="t_vol_${containerId}" class="text-zinc-900">${klineData[count-1].vol}張</b></span>
          </div>

          <svg id="svg_${containerId}" viewBox="0 0 ${w} ${totalH}" class="w-full h-44 cursor-crosshair overflow-visible touch-none">
            <line x1="0" y1="${hKline / 2}" x2="${w}" y2="${hKline / 2}" stroke="#e4e4e7" stroke-dasharray="3 3" />
            <line x1="0" y1="${hKline + 5}" x2="${w}" y2="${hKline + 5}" stroke="#d4d4d8" />
            ${candlesSvg}
            ${volumesSvg}
            <line id="cursor_v_${containerId}" x1="-100" y1="0" x2="-100" y2="${totalH}" stroke="#71717a" stroke-dasharray="2 2" stroke-width="1" class="kline-crosshair hidden" />
          </svg>
        </div>
      `;
    }

    function initKlineCrosshair(containerId, klineData) {
      const svg = document.getElementById(`svg_${containerId}`);
      if (!svg || !klineData) return;

      const vLine = document.getElementById(`cursor_v_${containerId}`);
      const w = 330;
      const count = klineData.length;
      const gap = w / count;

      function update(clientX) {
        const rect = svg.getBoundingClientRect();
        const offsetX = Math.max(0, Math.min(clientX - rect.left, rect.width));
        const svgX = (offsetX / rect.width) * w;
        const idx = Math.min(Math.max(Math.floor(svgX / gap), 0), count - 1);
        const d = klineData[idx];

        const barX = idx * gap + gap / 2;
        vLine.setAttribute('x1', barX);
        vLine.setAttribute('x2', barX);
        vLine.classList.remove('hidden');

        document.getElementById(`t_date_${containerId}`).innerText = d.date;
        document.getElementById(`t_open_${containerId}`).innerText = d.open;
        document.getElementById(`t_high_${containerId}`).innerText = d.high;
        document.getElementById(`t_low_${containerId}`).innerText = d.low;
        
        const closeEl = document.getElementById(`t_close_${containerId}`);
        closeEl.innerText = d.close;
        closeEl.className = d.isUp ? 'text-red-500 font-bold' : 'text-emerald-500 font-bold';

        document.getElementById(`t_vol_${containerId}`).innerText = d.vol + '張';
      }

      svg.addEventListener('mousemove', (e) => update(e.clientX));
      svg.addEventListener('mouseleave', () => vLine.classList.add('hidden'));
      svg.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) update(e.touches[0].clientX);
      }, { passive: true });
      svg.addEventListener('touchend', () => vLine.classList.add('hidden'));
    }

    function toggleDrawer(id, iconId, openText, closeText, klineInitCallback) {
      const el = document.getElementById(id);
      const icon = document.getElementById(iconId);
      if (!el) return;
      if (el.style.maxHeight && el.style.maxHeight !== '0px') {
        el.style.maxHeight = '0px';
        el.style.opacity = '0';
        if (icon) icon.innerText = openText;
      } else {
        el.style.maxHeight = '1400px';
        el.style.opacity = '1';
        if (icon) icon.innerText = closeText;
        if (klineInitCallback) setTimeout(klineInitCallback, 50);
      }
    }

    // 渲染全市場清單：有多少筆就顯示多少筆
    function renderList(stocks) {
      const container = document.getElementById('cards-container');
      const watchData = getWatchlistData();
      container.innerHTML = '';

      document.getElementById('list-count').innerText = stocks.length + ' 檔';

      if (stocks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-20 text-zinc-400 text-xs">
            <p>全市場目前無符合標的</p>
            <p class="text-[11px] text-zinc-400 mt-1">可在「計劃」分頁放寬倍數（例如選 0.0 不限倍數）</p>
          </div>
        `;
        return;
      }

      stocks.forEach(stock => {
        const ws = stock.wallStreet || {};
        const isWatched = !!watchData[stock.code];
        const isSelected = focusedStock && focusedStock.code === stock.code && !isViewingWatchlist;
        const watchBtnStyle = isWatched 
          ? 'bg-amber-500 text-zinc-950 font-bold border-amber-500' 
          : 'bg-zinc-100 text-zinc-500 border-zinc-200';
        const watchBtnText = isWatched ? '已自選' : '加入自選';

        const priceColor = stock.isUp ? 'text-red-500' : 'text-emerald-500';
        const selectedBorder = isSelected ? 'border-amber-500 shadow-md ring-1 ring-amber-500/30' : 'border-zinc-200/70';

        const targetRvol = userStrategy.maDays === 60 ? (ws.rvol60 || 1.2) : (ws.rvol20 || 1.2);
        const dynamicTags = [
          `量 ${ws.todayVol || 0}張`,
          `RVOL ${targetRvol}x`,
          `${ws.maTrend || '站上均線'}`
        ];
        const tagsHtml = dynamicTags.map(t => `<span class="px-2 py-0.5 rounded text-[10px] bg-zinc-100 text-zinc-700 font-mono font-medium">${t}</span>`).join('');
        const chartContainerId = `kline_${stock.code}`;

        const card = `
          <div onclick="setFocusStock(rawStocksData.find(s=>s.code==='${stock.code}'), false)" class="bg-white rounded-2xl p-4 border ${selectedBorder} smooth-transition active:scale-[0.99] cursor-pointer">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-lg font-bold text-zinc-900">${stock.name}</span>
                  <span class="text-xs font-mono text-zinc-500 bg-zinc-100 px-1.5 py-0.5 rounded">${stock.code}</span>
                  <button onclick="event.stopPropagation(); toggleWatchlist('${stock.code}')" class="text-[10px] px-2 py-0.5 rounded border ${watchBtnStyle} smooth-transition">
                    ${watchBtnText}
                  </button>
                </div>
                <p class="text-xs text-zinc-500 mt-1">${stock.desc}</p>
              </div>

              <div class="text-right">
                <div class="text-base font-black font-mono ${priceColor}">$${stock.price.toFixed(2)}</div>
                <div class="text-xs font-bold font-mono ${priceColor}">${stock.change}</div>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 mt-3">
              ${tagsHtml}
            </div>

            <div onclick="event.stopPropagation(); toggleDrawer('drawer_${stock.code}', 'icon_${stock.code}', '展開', '收起', () => initKlineCrosshair('${chartContainerId}', rawStocksData.find(s=>s.code==='${stock.code}').kline))" class="flex items-center justify-between mt-3 pt-3 border-t border-zinc-100 text-xs text-zinc-500">
              <span>近月日 K 線與細部數值</span>
              <span id="icon_${stock.code}" class="font-medium text-zinc-700">展開</span>
            </div>

            <div id="drawer_${stock.code}" class="drawer-content max-h-0 opacity-0 overflow-hidden text-xs text-zinc-700 space-y-2.5 pt-0">
              <div class="mt-2.5 bg-zinc-50 rounded-xl p-3 border border-zinc-100">
                ${renderInteractiveKline(chartContainerId, stock.kline)}
              </div>
              <div class="bg-zinc-50 rounded-xl p-3.5 border border-zinc-100 space-y-1.5 text-[11px] leading-relaxed">
                <div><b class="text-zinc-900">量價結構：</b>今日成交 ${(ws.todayVol || 0).toLocaleString()} 張（20 日均量 ${(ws.ma20Vol || 0).toLocaleString()} 張 / 60 日均量 ${(ws.ma60Vol || 0).toLocaleString()} 張）。</div>
                <div><b class="text-zinc-900">均線位階：</b>20MA $${ws.ma20Price || '--'}，60MA $${ws.ma60Price || '--'}。</div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });
    }

    function renderForeign(stocks) {
      const container = document.getElementById('foreign-container');
      container.innerHTML = '';
      stocks.slice(0, 30).forEach(s => {
        const intel = s.foreignIntel;
        if (!intel || !intel.title) return;
        const displayTitle = intel.zh_title || intel.title;

        container.insertAdjacentHTML('beforeend', `
          <div class="bg-white rounded-2xl p-4 border border-zinc-200/60 space-y-2">
            <div class="flex justify-between items-center text-[10px] text-zinc-400">
              <span class="font-bold text-amber-800 bg-amber-50 border border-amber-200/60 px-2.5 py-0.5 rounded-full font-mono">${intel.source}</span>
              <span class="font-mono">${intel.date}</span>
            </div>
            <div class="text-xs font-bold text-zinc-900 leading-snug">${displayTitle}</div>
            <p class="text-xs text-zinc-600 leading-relaxed">${intel.summary}</p>
            <div class="pt-2.5 border-t border-zinc-100 flex justify-between items-center text-xs">
              <span class="text-zinc-500">關聯標的：<b class="text-zinc-900">${s.name} (${s.code})</b></span>
              <a href="${intel.url}" target="_blank" rel="noopener noreferrer" class="px-3 py-1 bg-zinc-900 text-amber-400 rounded-lg font-medium hover:bg-zinc-800 text-[11px]">
                閱讀專文
              </a>
            </div>
          </div>
        `);
      });
    }

    function renderWatchlist() {
      const container = document.getElementById('watchlist-container');
      const watchData = getWatchlistData();
      const codes = Object.keys(watchData);
      container.innerHTML = '';

      if (codes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-20 text-zinc-400 text-xs">
            <p>尚無自選標的</p>
            <p class="text-[11px] text-zinc-400 mt-1">於標的列表點擊「加入自選」即可納入追蹤</p>
          </div>
        `;
        return;
      }

      codes.forEach(code => {
        const stock = rawStocksData.find(s => s.code === code);
        if (!stock) return;
        const info = watchData[code];
        const ws = stock.wallStreet || {};

        const isSelected = focusedStock && focusedStock.code === stock.code && isViewingWatchlist;
        const selectedBorder = isSelected ? 'border-amber-500 shadow-md ring-1 ring-amber-500/30' : 'border-zinc-200/70';
        const watchChartId = `watch_kline_${stock.code}`;

        const card = `
          <div onclick="setFocusStock(rawStocksData.find(s=>s.code==='${stock.code}'), true)" class="bg-white rounded-2xl p-4 border ${selectedBorder} cursor-pointer smooth-transition active:scale-[0.99]">
            
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-lg font-bold text-zinc-900">${stock.name}</span>
                  <span class="text-xs font-mono text-zinc-500 bg-zinc-100 px-1.5 py-0.5 rounded">${stock.code}</span>
                  <button onclick="event.stopPropagation(); toggleWatchlist('${stock.code}')" class="text-[10px] px-2 py-0.5 rounded bg-zinc-100 text-zinc-500 hover:text-red-600">
                    移除
                  </button>
                </div>
                <div class="text-[11px] text-zinc-400 mt-1 font-mono">加入日 ${info.addDate} · 基準價 $${info.basePrice.toFixed(2)}</div>
              </div>

              <div class="text-right" onclick="event.stopPropagation()">
                <div class="text-[10px] text-zinc-400 mb-0.5">買入成本</div>
                <div class="flex items-center justify-end gap-1">
                  <span class="text-zinc-400 text-xs font-mono">$</span>
                  <input 
                    type="number" 
                    step="0.05" 
                    placeholder="${info.basePrice.toFixed(2)}" 
                    value="${info.customCost !== null ? info.customCost : ''}" 
                    onchange="updateCustomCost('${stock.code}', this.value)"
                    class="w-16 px-1.5 py-0.5 text-right text-xs bg-zinc-50 border border-zinc-200 rounded focus:outline-none focus:border-amber-500 text-zinc-800 font-bold font-mono"
                  />
                </div>
              </div>
            </div>

            <div onclick="event.stopPropagation(); toggleDrawer('watch_drawer_${stock.code}', 'watch_icon_${stock.code}', '展開走勢與數據', '收起', () => initKlineCrosshair('${watchChartId}', rawStocksData.find(s=>s.code==='${stock.code}').kline))" class="flex items-center justify-between mt-3 pt-3 border-t border-zinc-100 text-xs text-zinc-500">
              <span>近月日 K 線與深度指標判讀</span>
              <span id="watch_icon_${stock.code}" class="font-medium text-zinc-700">展開走勢與數據</span>
            </div>

            <div id="watch_drawer_${stock.code}" class="drawer-content max-h-0 opacity-0 overflow-hidden text-xs text-zinc-700 pt-0 space-y-3">
              <div class="mt-3 bg-zinc-50 rounded-xl p-3 border border-zinc-100">
                ${renderInteractiveKline(watchChartId, stock.kline)}
              </div>

              <div class="bg-zinc-50 p-3 rounded-xl border border-zinc-100 space-y-2">
                <div class="flex justify-between items-center">
                  <span class="text-zinc-900 font-bold">交易量能對比</span>
                  <span class="font-mono font-bold text-red-600">60MA 之 ${ws.rvol60 || 1.5} 倍</span>
                </div>
                <div class="grid grid-cols-3 gap-1.5 text-[11px] font-mono text-zinc-700 bg-white p-2 rounded-lg border border-zinc-200/50 text-center">
                  <div><span class="text-zinc-400 block text-[10px]">當日成交</span><b>${(ws.todayVol || 0).toLocaleString()}張</b></div>
                  <div><span class="text-zinc-400 block text-[10px]">20日均量</span><b>${(ws.ma20Vol || 0).toLocaleString()}張</b></div>
                  <div><span class="text-zinc-400 block text-[10px]">60日均量</span><b>${(ws.ma60Vol || 0).toLocaleString()}張</b></div>
                </div>
              </div>
            </div>

          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });
    }

    function switchTab(tab) {
      const views = ['radar', 'foreign', 'watchlist', 'rules'];
      views.forEach(v => {
        const el = document.getElementById('view-' + v);
        const nav = document.getElementById('nav-' + v);
        if (v === tab) {
          el.classList.remove('hidden');
          nav.className = 'text-amber-400 font-bold text-xs tracking-wider whitespace-nowrap smooth-transition px-1';
        } else {
          el.classList.add('hidden');
          nav.className = 'text-zinc-400 hover:text-white font-medium text-xs tracking-wider whitespace-nowrap smooth-transition px-1';
        }
      });
      if (tab === 'watchlist') {
        renderWatchlist();
        const watchCodes = Object.keys(getWatchlistData());
        if (watchCodes.length > 0) {
          setFocusStock(rawStocksData.find(s => s.code === watchCodes[0]), true);
        }
      } else if (tab === 'radar' && currentList.length > 0) {
        setFocusStock(currentList[0], false);
      }
    }

    // 全市場篩選引擎：不限數量，符合幾檔就顯示幾檔
    function executeScan() {
      const btn = document.getElementById('scan-btn');
      const text = document.getElementById('scan-text');

      btn.classList.add('animate-pulse', 'opacity-75', 'scale-95');
      text.innerText = '搜尋中';

      fetch('./data.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
          rawStocksData = data.stocks || [];
          document.getElementById('market-date').innerText = data.update_time || '--';

          setTimeout(() => {
            let filtered = rawStocksData.filter(s => {
              const ws = s.wallStreet || {};
              const targetRvol = userStrategy.maDays === 60 ? (ws.rvol60 || 1.0) : (ws.rvol20 || 1.0);
              
              const passVol = userStrategy.volMultiplier === 0 ? true : (targetRvol >= userStrategy.volMultiplier);
              const passTrend = userStrategy.trendFilter === 'any' ? true : s.isUp;

              return passVol && passTrend;
            });

            const summaryEl = document.getElementById('active-rule-summary');
            if (filtered.length > 0) {
              summaryEl.innerText = `全台股篩選結果 (共 ${filtered.length} 檔)`;
            } else {
              filtered = [...rawStocksData].sort((a, b) => (b.fundScore || 0) - (a.fundScore || 0));
              summaryEl.innerText = `無完全符合，已依供需分數排序 (共 ${filtered.length} 檔)`;
            }

            currentList = filtered;
            if (currentList.length > 0) {
              setFocusStock(currentList[0], false);
              renderList(currentList);
              renderForeign(currentList);
            }

            btn.classList.remove('animate-pulse', 'opacity-75', 'scale-95');
            text.innerText = '篩選標的';
          }, 350);
        })
        .catch(err => {
          console.error(err);
          btn.classList.remove('animate-pulse', 'opacity-75', 'scale-95');
          text.innerText = '篩選標的';
        });
    }

    loadStrategy();
    executeScan();
  </script>
</body>
</html>
