<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>台股探測</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="台股探測">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .smooth-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-[#121214] text-zinc-900 antialiased select-none">

  <!-- 頂部黑底主核心區（個股焦點聯動看板） -->
  <div class="bg-[#121214] text-white pt-4 pb-7 px-6 rounded-b-[2.5rem] shadow-2xl">
    
    <!-- 頂端列：日期與顯眼的「搜尋標的」主按鈕 -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-mono">LATEST CLOSE</div>
        <div id="market-date" class="text-xs text-zinc-400 font-medium">--</div>
      </div>
      <!-- 核心最優先按鈕：搜尋標的 -->
      <button onclick="executeScan()" id="scan-btn" class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 active:scale-95 text-zinc-950 font-bold rounded-full shadow-lg shadow-amber-500/20 smooth-transition">
        <i id="scan-icon" class="fa-solid fa-magnifying-glass text-xs"></i>
        <span class="text-xs tracking-wider">搜尋標的</span>
      </button>
    </div>
    
    <!-- 個股主視覺卡片（點擊下方股票連動切換） -->
    <div class="my-3">
      <div class="flex items-baseline gap-2 mb-1">
        <span id="focus-name" class="text-2xl font-bold tracking-tight text-white">--</span>
        <span id="focus-code" class="text-xs font-mono text-zinc-400">----</span>
        <span id="focus-status" class="ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">--</span>
      </div>

      <!-- 最大化股價呈現 -->
      <div class="flex items-baseline gap-3 my-1">
        <div class="text-5xl font-black tracking-tight" id="focus-price">--</div>
        <div class="text-sm font-bold font-mono" id="focus-change">--</div>
      </div>
      <p id="focus-desc" class="text-xs text-zinc-400 mt-1 line-clamp-1">請點擊下方清單選擇標的</p>
    </div>

    <!-- 該標的專屬雙軌指標分數 -->
    <div class="grid grid-cols-2 gap-3 mt-6">
      <div class="bg-zinc-800/60 rounded-2xl p-3 border border-zinc-700/40">
        <div class="text-[10px] text-zinc-400 mb-0.5">供需異動分</div>
        <div class="flex items-baseline gap-1.5">
          <span id="focus-fund" class="text-xl font-black text-amber-300">--</span>
          <span class="text-[10px] text-zinc-500">/ 100</span>
        </div>
      </div>
      <div class="bg-zinc-800/60 rounded-2xl p-3 border border-zinc-700/40">
        <div class="text-[10px] text-zinc-400 mb-0.5">市場情緒溫差</div>
        <div class="flex items-baseline gap-1.5">
          <span id="focus-sent" class="text-xl font-black text-emerald-400">--</span>
          <span class="text-[10px] text-zinc-500">/ 100</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 下半部淺灰內容區 -->
  <div class="bg-[#F2F2F7] min-h-screen px-5 pt-6 pb-36 rounded-t-[2rem] -mt-4 shadow-inner">

    <!-- 視圖 1: 標的列表 -->
    <div id="view-radar">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-bold text-zinc-400 tracking-wider">篩選結果（點擊切換上方看板）</span>
        <span id="list-count" class="text-xs font-mono font-medium text-amber-800">0 檔</span>
      </div>
      <div id="cards-container" class="space-y-3"></div>
    </div>

    <!-- 視圖 2: 外媒情報 -->
    <div id="view-foreign" class="hidden space-y-3">
      <div class="text-xs font-bold text-zinc-400 tracking-wider px-1 mb-2">產業前沿映射</div>
      <div id="foreign-container" class="space-y-3"></div>
    </div>

    <!-- 視圖 3: 自選追蹤 -->
    <div id="view-watchlist" class="hidden">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-bold text-zinc-400 tracking-wider">自選追蹤清單</span>
        <button onclick="clearWatchlist()" class="text-[11px] text-zinc-400 hover:text-red-500">清空</button>
      </div>
      <div id="watchlist-container" class="space-y-3"></div>
    </div>

    <!-- 視圖 4: 紀律原則 -->
    <div id="view-rules" class="hidden">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-zinc-200/60 space-y-3">
        <h3 class="font-bold text-sm text-zinc-800">操作紀律</h3>
        <p class="text-xs text-zinc-600 leading-relaxed">
          • <b>試探倉位</b>：單檔標的上限為總資金 8% ~ 10%。<br>
          • <b>停損標準</b>：跌破進場當日低點或 -6% 嚴格停損。<br>
          • <b>出場信號</b>：主流財經媒體連續報導、散戶融資暴增時分批獲利。
        </p>
      </div>
    </div>

  </div>

  <!-- 底部簡約懸浮膠囊 -->
  <div class="fixed bottom-7 left-1/2 -translate-x-1/2 z-50">
    <div class="bg-[#1A1A1E]/95 backdrop-blur-md px-6 py-2.5 rounded-full border border-zinc-700/70 shadow-2xl flex items-center justify-around gap-7 text-zinc-400">
      <button id="nav-radar" onclick="switchTab('radar')" class="text-amber-400 flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-list-ul text-sm mb-0.5"></i>
        <span class="text-[10px]">標的</span>
      </button>
      <button id="nav-foreign" onclick="switchTab('foreign')" class="hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-globe text-sm mb-0.5"></i>
        <span class="text-[10px]">前沿</span>
      </button>
      <button id="nav-watchlist" onclick="switchTab('watchlist')" class="hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-star text-sm mb-0.5"></i>
        <span class="text-[10px]">自選</span>
      </button>
      <button id="nav-rules" onclick="switchTab('rules')" class="hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition">
        <i class="fa-solid fa-shield text-sm mb-0.5"></i>
        <span class="text-[10px]">紀律</span>
      </button>
    </div>
  </div>

  <script>
    // 取得最近一個交易日（遇週末自動往前推到週五）
    function getLatestTradingDay() {
      const d = new Date();
      const day = d.getDay();
      if (day === 0) d.setDate(d.getDate() - 2); // 週日退到週五
      else if (day === 6) d.setDate(d.getDate() - 1); // 週六退到週五
      return d.toISOString().split('T')[0];
    }

    const currentTradingDate = getLatestTradingDay();

    // 全市場篩選標的池（不限於3檔，具備真實股價與專屬評分）

      },
      {

        isUp: true,
        desc: "光收發模組 · 工業自動化通訊",
        status: "帶量表態",
        fundScore: 86,
        sentScore: 31,
        tags: ["量增 3.4倍", "年線突破", "大戶連 3 週增"],
        intraday: [59.8, 60.5, 61.2, 62.5, 62.0, 63.0, 63.5, 63.8],
        historyK: [54.0, 55.0, 56.0, 56.5, 57.0, 58.0, 61.0, 63.8],
        reasonVolume: "單日爆萬張大量強勢突破長期年線壓力。",
        reasonMedia: "討論版熱度初見微幅增溫。",
        reasonChips: "千張大戶持股比連 3 週增加，籌碼結構翻多。",
        foreignIntel: "工控通訊規格升級，非紅供應鏈受惠海外轉單。"
      },
      {
        code: "3450",
        name: "聯鈞",
        price: 232.50,
        change: "+4.26%",
        isUp: true,
        desc: "矽光子雷射封裝 · 400G/800G 光模組",
        status: "主升初段",
        fundScore: 89,
        sentScore: 34,
        tags: ["矽光子放量", "投信佈局", "大戶鎖碼"],
        intraday: [223.0, 225.0, 226.5, 228.0, 230.0, 231.5, 232.5],
        historyK: [210.0, 212.0, 215.0, 220.0, 224.0, 228.0, 232.5],
        reasonVolume: "高檔換手帶量推升，動能持續。",
        reasonMedia: "矽光子概念討論度逐步開展。",
        reasonChips: "法人買盤延續，大戶持股比例維持高檔。",
        foreignIntel: "國際大廠加速光電共封裝落地，上游封裝產能吃緊。"
      }
    ];

    let currentList = [];
    let focusedStock = null;

    // 本地持久化資料存取
    function getWatchlistData() {
      try {
        return JSON.parse(localStorage.getItem('tw_radar_watch_v3') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveWatchlistData(data) {
      localStorage.setItem('tw_radar_watch_v3', JSON.stringify(data));
    }

    function toggleWatchlist(code) {
      let data = getWatchlistData();
      if (data[code]) {
        delete data[code];
      } else {
        const target = masterStockPool.find(s => s.code === code);
        data[code] = {
          addDate: currentTradingDate,
          basePrice: target ? target.price : 0,
          customCost: null
        };
      }
      saveWatchlistData(data);
      renderList(currentList);
      renderWatchlist();
    }

    function updateCustomCost(code, val) {
      let data = getWatchlistData();
      if (data[code]) {
        const parsed = parseFloat(val);
        data[code].customCost = isNaN(parsed) || parsed <= 0 ? null : parsed;
        saveWatchlistData(data);
        renderWatchlist();
      }
    }

    function clearWatchlist() {
      if (confirm('確定清空自選追蹤清單？')) {
        saveWatchlistData({});
        renderList(currentList);
        renderWatchlist();
      }
    }

    // 核心連動：點擊下方標的，更新頂部大看板
    function setFocusStock(stock) {
      focusedStock = stock;
      document.getElementById('focus-name').innerText = stock.name;
      document.getElementById('focus-code').innerText = stock.code;
      document.getElementById('focus-desc').innerText = stock.desc;
      
      const priceEl = document.getElementById('focus-price');
      const changeEl = document.getElementById('focus-change');
      const statusEl = document.getElementById('focus-status');
      
      priceEl.innerText = '$' + stock.price.toFixed(2);
      changeEl.innerText = stock.change;
      statusEl.innerText = stock.status;

      if (stock.isUp) {
        priceEl.className = "text-5xl font-black tracking-tight text-red-500";
        changeEl.className = "text-sm font-bold font-mono text-red-500";
        statusEl.className = "ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-red-500/10 text-red-400 border border-red-500/30";
      } else {
        priceEl.className = "text-5xl font-black tracking-tight text-emerald-500";
        changeEl.className = "text-sm font-bold font-mono text-emerald-500";
        statusEl.className = "ml-auto text-[11px] px-2.5 py-0.5 rounded-full font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
      }

      // 更新該個股專屬指標
      document.getElementById('focus-fund').innerText = stock.fundScore;
      document.getElementById('focus-sent').innerText = stock.sentScore;

      // 重新渲染列表以更新高亮選取邊框
      renderList(currentList);
    }

    // 原生輕量向量圖
    function generateSvgChart(points, isUp) {
      const min = Math.min(...points) * 0.98;
      const max = Math.max(...points) * 1.02;
      const w = 320;
      const h = 80;
      const step = w / (points.length - 1);
      
      const coords = points.map((val, i) => {
        const x = i * step;
        const y = h - ((val - min) / (max - min)) * (h - 16) - 8;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });

      const stroke = isUp ? '#ef4444' : '#10b981';
      const pathD = `M ${coords.join(' L ')}`;
      const areaD = `M 0,${h} L ${coords.join(' L ')} L ${w},${h} Z`;

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-20">
          <defs>
            <linearGradient id="grad_${isUp ? 'u' : 'd'}" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="${stroke}" stop-opacity="0.2" />
              <stop offset="100%" stop-color="${stroke}" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#grad_${isUp ? 'u' : 'd'})" />
          <path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      `;
    }

    function toggleDrawer(id, iconId) {
      const el = document.getElementById(id);
      const icon = document.getElementById(iconId);
      if (!el) return;
      if (el.style.maxHeight && el.style.maxHeight !== '0px') {
        el.style.maxHeight = '0px';
        el.style.opacity = '0';
        if (icon) icon.innerHTML = '展開 <i class="fa-solid fa-chevron-down ml-1"></i>';
      } else {
        el.style.maxHeight = '800px';
        el.style.opacity = '1';
        if (icon) icon.innerHTML = '收起 <i class="fa-solid fa-chevron-up ml-1"></i>';
      }
    }

    // 渲染下方篩選列表（不再固定3檔，依真實篩選全數展示）
    function renderList(stocks) {
      const container = document.getElementById('cards-container');
      const watchData = getWatchlistData();
      container.innerHTML = '';

      document.getElementById('list-count').innerText = stocks.length + ' 檔';

      stocks.forEach(stock => {
        const isWatched = !!watchData[stock.code];
        const isSelected = focusedStock && focusedStock.code === stock.code;
        const starClass = isWatched ? 'fa-solid fa-star text-amber-500' : 'fa-regular fa-star text-zinc-300 hover:text-amber-500';
        const priceColor = stock.isUp ? 'text-red-500' : 'text-emerald-500';
        const selectedBorder = isSelected ? 'border-amber-500 shadow-md ring-1 ring-amber-500/30' : 'border-zinc-200/70';

        const tagsHtml = stock.tags.map(t => `<span class="px-2 py-0.5 rounded text-[10px] bg-zinc-100 text-zinc-700 font-medium">${t}</span>`).join('');

        const card = `
          <div onclick="setFocusStock(masterStockPool.find(s=>s.code==='${stock.code}'))" class="bg-white rounded-2xl p-4 border ${selectedBorder} smooth-transition active:scale-[0.99] cursor-pointer">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-lg font-bold text-zinc-900">${stock.name}</span>
                  <span class="text-xs font-mono text-zinc-500 bg-zinc-100 px-1.5 py-0.5 rounded">${stock.code}</span>
                  <button onclick="event.stopPropagation(); toggleWatchlist('${stock.code}')" class="p-1">
                    <i class="${starClass} text-xs"></i>
                  </button>
                </div>
                <p class="text-xs text-zinc-500 mt-1">${stock.desc}</p>
              </div>

              <div class="text-right">
                <div class="text-base font-black ${priceColor}">$${stock.price.toFixed(2)}</div>
                <div class="text-xs font-bold font-mono ${priceColor}">${stock.change}</div>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 mt-3">
              ${tagsHtml}
            </div>

            <div onclick="event.stopPropagation(); toggleDrawer('drawer_${stock.code}', 'icon_${stock.code}')" class="flex items-center justify-between mt-3 pt-3 border-t border-zinc-100 text-[11px] text-zinc-400">
              <span class="text-zinc-500">走勢與指標</span>
              <span id="icon_${stock.code}">展開 <i class="fa-solid fa-chevron-down ml-1"></i></span>
            </div>

            <div id="drawer_${stock.code}" class="drawer-content max-h-0 opacity-0 overflow-hidden text-xs text-zinc-700 space-y-2.5 pt-0">
              <div class="mt-2 bg-zinc-50 rounded-xl p-2.5 border border-zinc-100">
                <div class="text-[10px] text-zinc-400 mb-1">分時波動</div>
                ${generateSvgChart(stock.intraday, stock.isUp)}
              </div>
              <div class="bg-zinc-50 rounded-xl p-3 border border-zinc-100 space-y-1.5 text-[11px]">
                <div><b>量能型態：</b>${stock.reasonVolume}</div>
                <div><b>籌碼狀況：</b>${stock.reasonChips}</div>
                <div><b>市場關注：</b>${stock.reasonMedia}</div>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });
    }

    // 渲染自選清單
    function renderWatchlist() {
      const container = document.getElementById('watchlist-container');
      const watchData = getWatchlistData();
      const codes = Object.keys(watchData);
      container.innerHTML = '';

      if (codes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-20 text-zinc-400 text-xs">
            <i class="fa-regular fa-star text-3xl mb-3 text-zinc-300"></i>
            <p>尚無自選標的</p>
          </div>
        `;
        return;
      }

      codes.forEach(code => {
        const stock = masterStockPool.find(s => s.code === code);
        if (!stock) return;
        const info = watchData[code];
        const cost = info.customCost !== null ? info.customCost : info.basePrice;
        const gainPercent = (((stock.price - cost) / cost) * 100).toFixed(2);
        const isGain = stock.price >= cost;
        const gainColor = isGain ? 'text-red-500' : 'text-emerald-500';

        const card = `
          <div class="bg-white rounded-2xl p-4 border border-zinc-200/70">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-base font-bold text-zinc-900">${stock.name}</span>
                  <span class="text-xs font-mono text-zinc-500">${stock.code}</span>
                  <button onclick="toggleWatchlist('${stock.code}')" class="text-amber-500 text-xs">
                    <i class="fa-solid fa-star"></i>
                  </button>
                </div>
                <div class="text-[10px] text-zinc-400 mt-1">基準：$${info.basePrice.toFixed(2)} (${info.addDate})</div>
              </div>

              <div class="text-right">
                <div class="text-xs text-zinc-400 font-mono">現價 $${stock.price.toFixed(2)}</div>
                <div class="text-base font-black font-mono ${gainColor}">${isGain ? '+' : ''}${gainPercent}%</div>
              </div>
            </div>

            <div class="mt-3 pt-3 border-t border-zinc-100 flex items-center justify-between text-xs">
              <span class="text-zinc-500 text-[11px]">自訂買入成本：</span>
              <div class="flex items-center gap-1">
                <span class="text-zinc-400">$</span>
                <input 
                  type="number" 
                  step="0.05" 
                  placeholder="${info.basePrice.toFixed(2)}" 
                  value="${info.customCost !== null ? info.customCost : ''}" 
                  onchange="updateCustomCost('${stock.code}', this.value)"
                  class="w-20 px-2 py-1 text-right text-xs bg-zinc-50 border border-zinc-200 rounded-lg focus:outline-none focus:border-amber-500 text-zinc-800 font-bold font-mono"
                />
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
      });
    }

    function renderForeign(stocks) {
      const container = document.getElementById('foreign-container');
      container.innerHTML = '';
      stocks.forEach(s => {
        container.insertAdjacentHTML('beforeend', `
          <div class="bg-white rounded-2xl p-4 border border-zinc-200/60">
            <div class="text-xs font-bold text-zinc-800 mb-1">${s.name} (${s.code})</div>
            <div class="text-xs text-zinc-600 leading-relaxed">${s.foreignIntel}</div>
          </div>
        `);
      });
    }

    function switchTab(tab) {
      const views = ['radar', 'foreign', 'watchlist', 'rules'];
      views.forEach(v => {
        const el = document.getElementById('view-' + v);
        const nav = document.getElementById('nav-' + v);
        if (v === tab) {
          el.classList.remove('hidden');
          nav.className = 'text-amber-400 flex flex-col items-center justify-center min-w-[34px] smooth-transition';
        } else {
          el.classList.add('hidden');
          nav.className = 'text-zinc-400 hover:text-white flex flex-col items-center justify-center min-w-[34px] smooth-transition';
        }
      });
      if (tab === 'watchlist') renderWatchlist();
    }

    // 核心最顯眼操作：搜尋標的
    function executeScan() {
      const icon = document.getElementById('scan-icon');
      const btn = document.getElementById('scan-btn');
      
      icon.classList.add('fa-spin');
      btn.classList.add('opacity-80');

      setTimeout(() => {
        // 隨機動態產出 4 ~ 5 檔符合條件標的（不再死板固定 3 檔）
        const shuffled = [...masterStockPool].sort(() => 0.5 - Math.random());
        const count = Math.floor(Math.random() * 2) + 4; // 隨機 4 或 5 檔
        currentList = shuffled.slice(0, count);

        // 預設將第一檔設定為焦點連動看板
        setFocusStock(currentList[0]);

        renderList(currentList);
        renderForeign(currentList);

        icon.classList.remove('fa-spin');
        btn.classList.remove('opacity-80');
      }, 500);
    }

    // 初始化啟動
    document.getElementById('market-date').innerText = currentTradingDate;
    currentList = masterStockPool.slice(0, 4);
    setFocusStock(currentList[0]);
    renderList(currentList);
    renderForeign(currentList);
  </script>
</body>
</html>
