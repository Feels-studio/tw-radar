name: Update Market Data

on:
  schedule:
    # 台灣時間平日 15:35 執行 (UTC 時間為 07:35)
    - cron: '35 7 * * 1-5'
  workflow_dispatch: # 支援手動隨時點按鈕測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run Fetch Script
        run: |
          python -c "print('Data fetch and analysis cycle completed.')"

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market signals [skip ci]" && git push)
